; COMP0219 contact-based airspeed sensor - Nucleo-F411RE firmware.
;
; Each embedded env builds exactly one entry point from src/apps/; shared code is in lib/.
;   pio run -e airspeed -t upload     flash the competition firmware (default env)
;   pio run -e env_monitor -t upload  flash a bench tool instead
;   pio device monitor                open the ST-LINK virtual COM port at 115200
;   pio test -e native                run the lib/airmath unit tests on your PC

[platformio]
default_envs = airspeed_drag_plate  ; the competition build: a bare `pio run -t upload` flashes it

[nucleo]
platform = ststm32@~20.0.0
board = nucleo_f411re
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF
build_flags =
  -Wall
  -DSERIAL_TX_BUFFER_SIZE=256
  -DSERIAL_RX_BUFFER_SIZE=128
lib_deps =
  stm32duino/STM32duino LPS22DF@^1.1.0
  stm32duino/STM32duino STTS22H@^2.0.2
  sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@^1.0.6

; ---- Competition firmware --------------------------------------------------------------

[env:airspeed]
extends = nucleo
build_src_filter = +<apps/airspeed.cpp>
; Select the transducer here or in include/calibration.h, e.g.
; build_flags = ${nucleo.build_flags} -DAIRSPEED_METHOD=METHOD_DRAG_PLATE

; Same firmware, every transducer variant: CI builds these so none of them rot.
[env:airspeed_cup_hall]
extends = nucleo
build_src_filter = +<apps/airspeed.cpp>
build_flags = ${nucleo.build_flags} -DAIRSPEED_METHOD=METHOD_CUP_HALL

[env:airspeed_drag_plate]
extends = nucleo
build_src_filter = +<apps/airspeed.cpp>
build_flags = ${nucleo.build_flags} -DAIRSPEED_METHOD=METHOD_DRAG_PLATE

; The same build booting with a calibration profile (include/profiles/<name>/, from `calib tunnel-fit`) instead of
; calibration_generated.h. Switch back by flashing airspeed_drag_plate. The dashboard can switch a running board
; without a reflash (Wind speed > Settings > Calibration).
[env:airspeed_drag_plate_giga_20261029]
extends = env:airspeed_drag_plate
build_flags = ${env:airspeed_drag_plate.build_flags} -DCAL_PROFILE -I include/profiles/giga_20261029

[env:airspeed_drag_plate_giga_20261029_tared]
extends = env:airspeed_drag_plate
build_flags = ${env:airspeed_drag_plate.build_flags} -DCAL_PROFILE -I include/profiles/giga_20261029_tared

; The fallback when the tunnel calibration is in doubt: theory Cd·A (sqrt_k 242.5), zero from TARE, 10 Hz smoother
; (calib/models.py UNCALIBRATED). The dashboard can switch a running board to it without a reflash.
[env:airspeed_drag_plate_uncalibrated]
extends = env:airspeed_drag_plate
build_flags = ${env:airspeed_drag_plate.build_flags} -DCAL_SQRT_K=242.5f -DCAL_SQRT_X0=0.0f -DCAL_FILTER_KIND=0.0f -DCAL_LPF_HZ=10.0f

; ---- Bench tools ----------------------------------------------------------------------

[env:env_monitor]
extends = nucleo
build_src_filter = +<apps/env_monitor.cpp>

[env:i2c_scan]
extends = nucleo
build_src_filter = +<apps/i2c_scan.cpp>

[env:loadcell_test]
extends = nucleo
build_src_filter = +<apps/loadcell_test.cpp>

[env:bridge_probe]
extends = nucleo
build_src_filter = +<apps/bridge_probe.cpp>

[env:encoder_test]
extends = nucleo
build_src_filter = +<apps/encoder_test.cpp>

[env:hall_test]
extends = nucleo
build_src_filter = +<apps/hall_test.cpp>

; ---- Host unit tests ------------------------------------------------------------------

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_ignore = drivers
build_flags = -std=c++17 -Wall
